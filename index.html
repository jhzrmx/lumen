<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen: alerts, prompts and toasts</title>
<style>
  body{margin:0;background:#f3f4f8;color:#1c2333;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  body.dark{background:#0e1220;color:#e9edf5}
  .wrap{max-width:720px;margin:0 auto;padding:48px 20px 80px}
  h1{margin:0 0 4px;font-size:30px;letter-spacing:-.02em}
  .lead{margin:0 0 32px;opacity:.7}
  h2{margin:36px 0 12px;font-size:15px;font-weight:600}
  button.demo{margin:0 8px 8px 0;padding:10px 16px;font:inherit;font-size:14px;font-weight:600;color:inherit;background:#fff;border:1px solid #d5d9e5;border-radius:10px;cursor:pointer}
  body.dark button.demo{background:#171c2b;border-color:#2c3449}
  button.demo:hover{border-color:#8d97b1}
  button.demo:focus{outline:2px solid #2c7be5;outline-offset:2px}
  pre{margin:24px 0 0;padding:14px 16px;min-height:3em;background:#fff;border:1px solid #d5d9e5;border-radius:10px;font:13px/1.5 Consolas,Menlo,monospace;white-space:pre-wrap;word-wrap:break-word}
  body.dark pre{background:#171c2b;border-color:#2c3449}

  /* Example of restyling Lumen with customClass: a brutalist "brand" skin */
  .brand-popup{border-radius:0!important;box-shadow:6px 6px 0 #111!important;border:2px solid #111;font-family:Georgia,"Times New Roman",serif!important;text-align:left!important;background:#fffbe6!important;color:#111!important}
  .brand-popup .lm-title{font-size:1.5em;letter-spacing:0}
  .brand-btn{border-radius:0!important;font-family:Georgia,serif!important;border:2px solid #111!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lumen</h1>
  <p class="lead">Dependency-free alerts, prompts and toasts. Plain ES5, so it runs on anything from IE11 up.</p>

  <h2>Icons</h2>
  <button class="demo" id="b-success">Success</button>
  <button class="demo" id="b-error">Error</button>
  <button class="demo" id="b-warning">Warning</button>
  <button class="demo" id="b-danger">Danger</button>
  <button class="demo" id="b-info">Info</button>
  <button class="demo" id="b-question">Question</button>

  <h2>Decisions</h2>
  <button class="demo" id="b-confirm">Confirm / cancel</button>
  <button class="demo" id="b-three">Save, don't save, cancel</button>
  <button class="demo" id="b-footer">Footer link</button>

  <h2>Input</h2>
  <button class="demo" id="b-prompt">Prompt with validation</button>
  <button class="demo" id="b-select">Select</button>
  <button class="demo" id="b-async">Async confirm (loader)</button>
  <button class="demo" id="b-queue">Queue of 3 steps</button>

  <h2>Dismissal</h2>
  <button class="demo" id="b-closebtn">Default (× button, backdrop, Esc)</button>
  <button class="demo" id="b-noclose">No × button</button>
  <button class="demo" id="b-nobackdrop">Backdrop click disabled</button>
  <button class="demo" id="b-locked">Fully locked</button>
  <button class="demo" id="b-dynamic">Backdrop depends on a checkbox</button>

  <h2>Toasts, timers, loading</h2>
  <button class="demo" id="b-toast">Toast</button>
  <button class="demo" id="b-toast2">Toast, bottom centre</button>
  <button class="demo" id="b-toast3">Toast, title only (danger)</button>
  <button class="demo" id="b-timer">Auto-close with progress bar</button>
  <button class="demo" id="b-loading">Loading</button>

  <h2>Customising</h2>
  <button class="demo" id="b-theme">Toggle dark theme</button>
  <button class="demo" id="b-brand">Custom skin (customClass)</button>
  <button class="demo" id="b-top">Top position, wide</button>

  <pre id="out" aria-live="polite">Results appear here.</pre>
</div>

<script src="lumen.js"></script>
<script>
(function () {
  var dark = false;
  var out = document.getElementById('out');
  function show(r) { out.textContent = JSON.stringify(r, null, 2); }
  function $(id) { return document.getElementById(id); }
  function theme() { return dark ? 'dark' : 'light'; }

  // One place to set defaults for everything on this page
  Lumen.setDefaults({ theme: 'light' });

  $('b-success').onclick  = function () { Lumen.success('Payment received', 'A receipt is on its way to your inbox.').then(show); };
  $('b-error').onclick    = function () { Lumen.error('Upload failed', 'The file is larger than 10 MB. Choose a smaller one and try again.').then(show); };
  $('b-warning').onclick  = function () { Lumen.warning('Unsaved changes', 'Leaving now will discard your edits.').then(show); };
  $('b-danger').onclick   = function () { Lumen.danger('Delete account', 'Your data will be erased permanently.').then(show); };
  $('b-info').onclick     = function () { Lumen.info('Maintenance tonight', 'The service will be read-only from 22:00 to 22:30 UTC.').then(show); };
  $('b-question').onclick = function () { Lumen.question('Need a hand?', 'Our team replies within a few minutes.').then(show); };

  $('b-confirm').onclick = function () {
    // confirm(title, text, icon, confirmButtonText | options)
    Lumen.confirm('Delete this project?', 'All 14 files will be removed. This cannot be undone.', 'danger', 'Delete project').then(show);
  };
  $('b-three').onclick = function () {
    Lumen.fire({
      title: 'Save changes before closing?',
      showDenyButton: true, showCancelButton: true,
      confirmButtonText: 'Save', denyButtonText: "Don't save"
    }).then(show);
  };
  $('b-footer').onclick = function () {
    Lumen.fire({
      icon: 'info', title: 'Invite sent',
      text: 'Maya will get an email with a link that expires in 7 days.',
      footer: '<a href="#" onclick="return false">Manage pending invites</a>'
    }).then(show);
  };

  $('b-prompt').onclick = function () {
    Lumen.prompt('Name your workspace', {
      inputLabel: 'Workspace name', inputPlaceholder: 'e.g. Studio North',
      inputAttributes: { maxlength: 24, autocomplete: 'off' },
      confirmButtonText: 'Create workspace',
      inputValidator: function (v) { if (!v || v.replace(/\s/g, '').length < 3) { return 'Use at least 3 characters.'; } }
    }).then(show);
  };
  $('b-select').onclick = function () {
    Lumen.fire({
      title: 'Export format', input: 'select',
      inputOptions: { csv: 'CSV (spreadsheet)', json: 'JSON', pdf: 'PDF report' },
      inputPlaceholder: 'Choose a format', showCancelButton: true, confirmButtonText: 'Export',
      inputValidator: function (v) { if (!v) { return 'Pick a format to continue.'; } }
    }).then(show);
  };
  $('b-async').onclick = function () {
    Lumen.fire({
      icon: 'question', title: 'Publish now?', text: 'Your changes go live for everyone.',
      showCancelButton: true, confirmButtonText: 'Publish',
      preConfirm: function () {
        // Return any thenable (a Promise, or a plain { then: fn } so it works without Promise support).
        // Resolve with a value, return false to stay open, or fail to show the message in the dialog.
        return {
          then: function (ok, fail) {
            setTimeout(function () {
              if (Math.random() < 0.4) { fail(new Error('Server is busy. Try again.')); } else { ok({ published: true }); }
            }, 1200);
          }
        };
      }
    }).then(function (r) { show(r); if (r.isConfirmed) { Lumen.toast.success('Published'); } });
  };
  $('b-queue').onclick = function () {
    Lumen.queue([
      { title: 'Step 1 of 3', input: 'text', inputLabel: 'Your name', confirmButtonText: 'Next', showCancelButton: true },
      { title: 'Step 2 of 3', input: 'radio', inputOptions: { s: 'Small', m: 'Medium', l: 'Large' }, inputValue: 'm', confirmButtonText: 'Next', showCancelButton: true },
      { title: 'Step 3 of 3', input: 'checkbox', inputLabel: 'Email me the summary', inputValue: 1, confirmButtonText: 'Finish' }
    ]).then(show);
  };

  $('b-closebtn').onclick = function () {
    // The × button is on by default for dialogs
    Lumen.info('Easy to leave', 'Use the × button, click outside, or press Esc.').then(show);
  };
  $('b-noclose').onclick = function () {
    Lumen.fire({ icon: 'info', title: 'No × button', text: 'You can still click outside or press Esc.', showCloseButton: false }).then(show);
  };
  $('b-nobackdrop').onclick = function () {
    Lumen.fire({ icon: 'warning', title: 'Choose an option', text: 'Clicking the backdrop does nothing here.',
      allowOutsideClick: false, showCancelButton: true }).then(show);
  };
  $('b-locked').onclick = function () {
    Lumen.fire({ icon: 'warning', title: 'Action required', text: 'No ×, no backdrop click, no Esc. Only the button closes this.',
      showCloseButton: false, allowOutsideClick: false, allowEscapeKey: false, confirmButtonText: 'I understand' }).then(show);
  };
  $('b-dynamic').onclick = function () {
    var box = document.createElement('label');
    box.style.cssText = 'display:block;margin-top:12px;cursor:pointer';
    box.innerHTML = '<input type="checkbox" id="lock-box"> Lock this dialog';
    Lumen.fire({
      title: 'Decide at click time', text: 'Tick the box, then click outside.', html: box,
      // allowOutsideClick (and allowEscapeKey) can be functions
      allowOutsideClick: function () { return !document.getElementById('lock-box').checked; }
    }).then(show);
  };

  $('b-toast').onclick  = function () { Lumen.toast.success('Saved', 'Draft synced just now.', { theme: theme() }).then(show); };
  $('b-toast2').onclick = function () { Lumen.toast.info('New version available', { position: 'bottom', showCloseButton: true, timer: 5000, theme: theme() }); };
  $('b-toast3').onclick = function () { Lumen.toast.danger('Connection lost'); };
  $('b-timer').onclick  = function () { Lumen.fire({ icon: 'success', title: 'Message sent', timer: 3000, timerProgressBar: true, showConfirmButton: false }).then(show); };
  $('b-loading').onclick = function () {
    Lumen.loading('Syncing your files', 'This usually takes a few seconds.');
    setTimeout(function () { Lumen.close(); Lumen.toast.success('All files synced', { theme: theme() }); }, 2000);
  };

  $('b-theme').onclick = function () {
    dark = !dark;
    document.body.className = dark ? 'dark' : '';
    Lumen.setDefaults({ theme: theme() });
    Lumen.info('Theme: ' + theme(), 'New dialogs use this theme. Pass theme: "auto" to follow the system setting.');
  };

  var Brand = Lumen.mixin({
    radius: 0, backdrop: 'rgba(17,17,17,.35)',
    customClass: { popup: 'brand-popup', confirmButton: 'brand-btn', cancelButton: 'brand-btn' }
  });
  $('b-brand').onclick = function () {
    Brand.confirm('Print the zine?', 'Fifty copies, saddle-stitched.', { icon: null, confirmButtonColor: '#111', confirmButtonText: 'Print' }).then(show);
  };
  $('b-top').onclick = function () {
    Lumen.fire({ position: 'top', width: 520, title: 'Cookies', text: 'We use a single cookie to remember your language.', confirmButtonText: 'Accept', showCancelButton: true, cancelButtonText: 'Decline', backdrop: false }).then(show);
  };
}());
</script>
</body>
</html>
